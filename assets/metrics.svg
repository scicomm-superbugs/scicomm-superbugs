<svg width="850" height="195" viewBox="0 0 850 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Shimmer Beam Effect -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="200%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="300%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Balanced Metric Segment Gradients -->
    <linearGradient id="gradCommits" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradPRs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradReviews" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gradIssues" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradPython" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gradTS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
    .stat-number { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.2px; }
    .legend-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #cbd5e1; }
    .legend-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .lang-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .lang-pct { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Main Container Card -->
  <rect x="1" y="1" width="848" height="193" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Vertical Divider -->
  <line x1="425" y1="20" x2="425" y2="175" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- ================= LEFT SECTION: BALANCED ACTIVITY DONUT ================= -->
  <g transform="translate(24, 18)">
    <!-- Section Header -->
    <circle cx="5" cy="7" r="3.5" fill="#38bdf8"/>
    <text x="16" y="11" class="title">Engineering &amp; Activity Balance</text>
    <text x="16" y="27" class="subtitle">Distributed across development, reviews &amp; architecture</text>

    <!-- Donut Chart (Circumference = 263.89) -->
    <g transform="translate(80, 102)">
      <!-- Background Track -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="10"/>

      <!-- Commits: 70% = 184.72 -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="url(#gradCommits)" stroke-width="10"
              stroke-dasharray="182.2 263.89" stroke-dashoffset="0"
              transform="rotate(-90)"/>

      <!-- PRs: 11% = 29.03 -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="url(#gradPRs)" stroke-width="10"
              stroke-dasharray="27 263.89" stroke-dashoffset="-184.7"
              transform="rotate(-90)"/>

      <!-- Code Reviews: 9% = 23.75 -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="url(#gradReviews)" stroke-width="10"
              stroke-dasharray="21.75 263.89" stroke-dashoffset="-213.75"
              transform="rotate(-90)"/>

      <!-- Issues: 10% = 26.39 -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="url(#gradIssues)" stroke-width="10"
              stroke-dasharray="24.4 263.89" stroke-dashoffset="-237.5"
              transform="rotate(-90)"/>

      <!-- Center Stats -->
      <text x="0" y="4" class="stat-number" text-anchor="middle">798+</text>
      <text x="0" y="18" class="stat-label" text-anchor="middle">TOTAL</text>
    </g>

    <!-- Clean Graphical Legend Grid -->
    <g transform="translate(180, 56)">
      <!-- Commits: 70% -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="8" height="8" rx="2" fill="#38bdf8"/>
        <text x="16" y="8.5" class="legend-name">Commits &amp; Code</text>
        <text x="185" y="8.5" text-anchor="end" class="legend-val" fill="#38bdf8">70%</text>
      </g>

      <!-- Pull Requests: 11% -->
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="8" height="8" rx="2" fill="#c084fc"/>
        <text x="16" y="8.5" class="legend-name">Pull Requests</text>
        <text x="185" y="8.5" text-anchor="end" class="legend-val" fill="#c084fc">11%</text>
      </g>

      <!-- Code Reviews: 9% -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="8" height="8" rx="2" fill="#fbbf24"/>
        <text x="16" y="8.5" class="legend-name">Code Reviews</text>
        <text x="185" y="8.5" text-anchor="end" class="legend-val" fill="#fbbf24">9%</text>
      </g>

      <!-- Issues & Management: 10% -->
      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="8" height="8" rx="2" fill="#34d399"/>
        <text x="16" y="8.5" class="legend-name">Issues &amp; Triaging</text>
        <text x="185" y="8.5" text-anchor="end" class="legend-val" fill="#34d399">10%</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT SECTION: LANGUAGES & STACK ================= -->
  <g transform="translate(450, 18)">
    <!-- Section Header -->
    <circle cx="5" cy="7" r="3.5" fill="#818cf8"/>
    <text x="16" y="11" class="title">Languages &amp; Core Stack</text>
    <text x="16" y="27" class="subtitle">Primary codebase composition &amp; application layer</text>

    <!-- Python Bar -->
    <g transform="translate(0, 44)">
      <circle cx="4" cy="6" r="3.5" fill="#38bdf8"/>
      <text x="15" y="10" class="lang-name">Python</text>
      <text x="375" y="10" text-anchor="end" class="lang-pct" fill="#38bdf8">52.1%</text>

      <rect x="0" y="17" width="375" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="17" width="195" height="7" rx="3.5" fill="url(#gradPython)"/>
      <rect x="0" y="17" width="195" height="7" rx="3.5" fill="url(#shimmer)"/>
    </g>

    <!-- TypeScript Bar -->
    <g transform="translate(0, 82)">
      <circle cx="4" cy="6" r="3.5" fill="#818cf8"/>
      <text x="15" y="10" class="lang-name">TypeScript</text>
      <text x="375" y="10" text-anchor="end" class="lang-pct" fill="#818cf8">47.9%</text>

      <rect x="0" y="17" width="375" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="17" width="180" height="7" rx="3.5" fill="url(#gradTS)"/>
      <rect x="0" y="17" width="180" height="7" rx="3.5" fill="url(#shimmer)"/>
    </g>

    <!-- Core Technologies Graphical Badges -->
    <g transform="translate(0, 126)">
      <!-- React 19 -->
      <rect x="0" y="0" width="82" height="24" rx="6" fill="#141e30" stroke="#1e293b" stroke-width="1"/>
      <text x="41" y="16" class="badge-text" fill="#61dafb">⚛ React 19</text>

      <!-- Next / Vite -->
      <rect x="90" y="0" width="98" height="24" rx="6" fill="#141e30" stroke="#1e293b" stroke-width="1"/>
      <text x="139" y="16" class="badge-text" fill="#ffffff">⚡ Next / Vite</text>

      <!-- Firebase -->
      <rect x="196" y="0" width="84" height="24" rx="6" fill="#141e30" stroke="#1e293b" stroke-width="1"/>
      <text x="238" y="16" class="badge-text" fill="#f59e0b">🔥 Firebase</text>

      <!-- Mobile / Capacitor -->
      <rect x="288" y="0" width="87" height="24" rx="6" fill="#141e30" stroke="#1e293b" stroke-width="1"/>
      <text x="331" y="16" class="badge-text" fill="#38bdf8">📱 Capacitor</text>
    </g>
  </g>
</svg>