<svg width="850" height="356" viewBox="0 0 850 356" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1724" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.3px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748b; font-weight: 500; }
    .stat-number { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
    .item-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #e2e8f0; font-weight: 600; }
    .item-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; fill: #10b981; letter-spacing: 0.5px; }
    .pill-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.7px; }
  </style>

  <!-- Main Background Container -->
  <rect x="0" y="0" width="850" height="356" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Navigation Header -->
  <g transform="translate(26, 18)">
    <circle cx="6" cy="12" r="4" fill="#10b981" filter="url(#glow)"/>
    <text x="18" y="16" class="title">Engineering &amp; Activity Dashboard</text>
    <text x="282" y="16" class="subtitle">Realtime metrics synchronized across repositories</text>
    
    <!-- Live Badge -->
    <rect x="674" y="2" width="124" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <circle cx="686" cy="13" r="3" fill="#10b981"/>
    <text x="696" y="16.5" class="badge-text">LIVE METRICS</text>
  </g>

  <!-- Left Panel: Activity & Contributions Overview -->
  <g transform="translate(26, 56)">
    <rect width="386" height="278" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Header -->
    <text x="20" y="26" class="item-label" font-size="14">Contribution Breakdown</text>
    <text x="20" y="42" class="subtitle">Distributed across 4 contribution quadrants</text>

    <!-- Stat Callout -->
    <g transform="translate(20, 56)">
      <text x="0" y="26" class="stat-number">757+</text>
      <text x="96" y="15" class="stat-label">Total Contributions</text>
      <text x="96" y="29" class="subtitle">Active across 12 Repositories</text>
    </g>

    <!-- Multi-Segment Distribution Bar -->
    <g transform="translate(20, 108)">
      <rect x="0" y="0" width="346" height="10" rx="5" fill="#1e293b"/>
      <!-- Commits: 69% = 239px -->
      <rect x="0" y="0" width="239" height="10" rx="5" fill="url(#cyanGrad)"/>
      <!-- Issues: 11% = 38px -->
      <rect x="241" y="0" width="38" height="10" fill="url(#emeraldGrad)"/>
      <!-- PRs: 11% = 38px -->
      <rect x="281" y="0" width="38" height="10" fill="url(#purpleGrad)"/>
      <!-- Reviews: 9% = 25px -->
      <rect x="321" y="0" width="25" height="10" rx="5" fill="url(#amberGrad)"/>
    </g>

    <!-- Metric Breakdown Grid -->
    <g transform="translate(20, 138)">
      <!-- Row 1 -->
      <circle cx="6" cy="7" r="4" fill="#3b82f6"/>
      <text x="16" y="11" class="item-label">Commits</text>
      <text x="125" y="11" class="item-value" fill="#3b82f6">69%</text>

      <circle cx="185" cy="7" r="4" fill="#10b981"/>
      <text x="195" y="11" class="item-label">Issues</text>
      <text x="315" y="11" class="item-value" fill="#10b981">11%</text>

      <!-- Row 2 -->
      <circle cx="6" cy="35" r="4" fill="#8b5cf6"/>
      <text x="16" y="39" class="item-label">Pull Requests</text>
      <text x="125" y="39" class="item-value" fill="#8b5cf6">11%</text>

      <circle cx="185" cy="35" r="4" fill="#f59e0b"/>
      <text x="195" y="39" class="item-label">Code Reviews</text>
      <text x="315" y="39" class="item-value" fill="#f59e0b">9%</text>
    </g>

    <!-- Footer Note Box -->
    <g transform="translate(20, 204)">
      <rect x="0" y="0" width="346" height="52" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="22" class="subtitle" font-size="11.5">✨ <tspan fill="#38bdf8" font-weight="600">Balanced Workflow:</tspan> Branching, PR Reviews &amp; Roadmap</text>
      <text x="29" y="38" class="subtitle" font-size="10.5">Continuous integration active across AIU departmental suites</text>
    </g>
  </g>

  <!-- Right Panel: Languages & Technology Stack -->
  <g transform="translate(438, 56)">
    <rect width="386" height="278" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Header -->
    <text x="20" y="26" class="item-label" font-size="14">Most Used Languages &amp; Stack</text>
    <text x="20" y="42" class="subtitle">Calculated across verified codebase lines</text>

    <!-- Language 1: Python -->
    <g transform="translate(20, 56)">
      <!-- Name on Left, Percentage on Right -->
      <circle cx="6" cy="7" r="4" fill="#38bdf8"/>
      <text x="16" y="11" class="item-label">Python</text>
      <text x="346" y="11" text-anchor="end" class="item-value" fill="#38bdf8">52.1%</text>
      
      <!-- Progress Bar -->
      <rect x="0" y="18" width="346" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="18" width="180" height="7" rx="3.5" fill="url(#cyanGrad)"/>

      <!-- Clean Subtitle Below Bar -->
      <text x="0" y="37" class="subtitle" font-size="11">Bioinformatics &#8226; Microbiome Models &#8226; AI Logic</text>
    </g>

    <!-- Language 2: TypeScript -->
    <g transform="translate(20, 110)">
      <!-- Name on Left, Percentage on Right -->
      <circle cx="6" cy="7" r="4" fill="#818cf8"/>
      <text x="16" y="11" class="item-label">TypeScript</text>
      <text x="346" y="11" text-anchor="end" class="item-value" fill="#818cf8">47.9%</text>
      
      <!-- Progress Bar -->
      <rect x="0" y="18" width="346" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="18" width="166" height="7" rx="3.5" fill="url(#purpleGrad)"/>

      <!-- Clean Subtitle Below Bar -->
      <text x="0" y="37" class="subtitle" font-size="11">React Applications &#8226; Cloud Architecture &#8226; APIs</text>
    </g>

    <!-- Core Stack Badges Box -->
    <g transform="translate(20, 168)">
      <rect x="0" y="0" width="346" height="88" rx="8" fill="#0f172a" stroke="#1e293b"/>
      
      <text x="14" y="20" class="pill-title">Core Application Technologies</text>
      
      <!-- Badges Row -->
      <g transform="translate(14, 28)">
        <!-- React 19 -->
        <rect x="0" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="35" y="15" class="subtitle" font-size="11" font-weight="600" text-anchor="middle" fill="#61dafb">React 19</text>

        <!-- Next / Vite -->
        <rect x="76" y="0" width="90" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="121" y="15" class="subtitle" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">Next.js / Vite</text>

        <!-- Firebase -->
        <rect x="172" y="0" width="74" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="209" y="15" class="subtitle" font-size="11" font-weight="600" text-anchor="middle" fill="#f59e0b">Firebase</text>

        <!-- Mobile -->
        <rect x="252" y="0" width="66" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="285" y="15" class="subtitle" font-size="11" font-weight="600" text-anchor="middle" fill="#38bdf8">Mobile</text>
      </g>

      <!-- Subtext -->
      <text x="14" y="72" class="subtitle" font-size="10.5">Automated schedules, lab inventory &amp; attendance systems</text>
    </g>
  </g>
</svg>