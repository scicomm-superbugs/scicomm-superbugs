<svg width="850" height="380" viewBox="0 0 850 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glass Panels -->
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1522" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shimmering Bar Gradients -->
    <linearGradient id="shimmerCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#06b6d4;#67e8f9;#38bdf8;#06b6d4" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="shimmerPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#8b5cf6;#c084fc;#a855f7;#8b5cf6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="shimmerEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="shimmerAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05   0 0 0 0 0.45   0 0 0 0 0.95  0 0 0 0.15 0"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseLive {
      0% { opacity: 0.5; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #10b981); }
      100% { opacity: 0.5; transform: scale(0.95); }
    }
    @keyframes sweepRadar {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 240; }
    }
    @keyframes radarPulse {
      0% { r: 18; opacity: 0.7; }
      50% { r: 24; opacity: 0.1; }
      100% { r: 18; opacity: 0.7; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }

    .live-dot { transform-origin: 686px 13px; animation: pulseLive 2s infinite ease-in-out; }
    .radar-pulse-ring { transform-origin: center; animation: radarPulse 3s infinite ease-out; }
    .radar-sweep-line { stroke-dasharray: 60 180; animation: sweepRadar 4s linear infinite; }
    .floating-badge { animation: floatCard 4s ease-in-out infinite; }

    .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.3px; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #64748b; font-weight: 500; }
    .stat-hero { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 32px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .stat-caption { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
    .item-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .item-pct { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .muted-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
    .pill-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .badge-live { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #10b981; letter-spacing: 0.6px; }
    .quadrant-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #94a3b8; text-anchor: middle; text-transform: uppercase; }
  </style>

  <!-- Container Frame -->
  <rect x="0" y="0" width="850" height="380" rx="16" fill="url(#mainBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Bar -->
  <g transform="translate(26, 18)">
    <circle cx="6" cy="12" r="4" fill="#38bdf8"/>
    <text x="18" y="16" class="header-title">Engineering &amp; Activity Ecosystem</text>
    <text x="285" y="16" class="header-sub">Realtime live metrics synchronized across repositories</text>

    <!-- Animated Live Pill -->
    <rect x="674" y="2" width="124" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <circle cx="686" cy="13" r="3.5" fill="#10b981" class="live-dot"/>
    <text x="696" y="16.5" class="badge-live">LIVE METRICS</text>
  </g>

  <!-- Left Card: Contribution Radar & Metrics -->
  <g transform="translate(26, 56)">
    <rect width="386" height="302" rx="12" fill="url(#cardGlass)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Header -->
    <text x="20" y="26" class="item-name" font-size="14">Contribution Dynamics</text>
    <text x="20" y="42" class="header-sub">Balanced distribution across 4 development quadrants</text>

    <!-- Top Left: Hero Stat -->
    <g transform="translate(20, 56)">
      <text x="0" y="28" class="stat-hero">767+</text><text x="96" y="15" class="stat-label">Total Contributions</text>
      <text x="96" y="30" class="header-sub">Active across 12 Repositories</text>
    </g>

    <!-- Top Right: Visual Interactive Radar Diamond Chart -->
    <g transform="translate(280, 50)">
      <!-- Radar Background Circles -->
      <circle cx="50" cy="50" r="38" fill="none" stroke="#1e293b" stroke-dasharray="3 3"/>
      <circle cx="50" cy="50" r="24" fill="none" stroke="#1e293b"/>
      
      <!-- Cross Axes -->
      <line x1="50" y1="8" x2="50" y2="92" stroke="#1e293b" stroke-width="1"/>
      <line x1="8" y1="50" x2="92" y2="50" stroke="#1e293b" stroke-width="1"/>

      <!-- Diamond Polygon (Current Balanced State!) -->
      <!-- Top (Reviews 9%): (50, 24) -->
      <!-- Right (Issues 11%): (78, 50) -->
      <!-- Bottom (PRs 11%): (50, 78) -->
      <!-- Left (Commits 69%): (16, 50) -->
      <polygon points="50,24 78,50 50,78 16,50" fill="#06b6d4" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.8"/>
      
      <!-- Pulsing Node Center -->
      <circle cx="50" cy="50" r="4" fill="#38bdf8"/>
      <circle cx="50" cy="50" r="18" fill="none" stroke="#38bdf8" stroke-width="1.2" class="radar-pulse-ring"/>

      <!-- Quadrant Markers -->
      <circle cx="50" cy="24" r="3" fill="#f59e0b"/> <!-- Review -->
      <circle cx="78" cy="50" r="3" fill="#10b981"/> <!-- Issues -->
      <circle cx="50" cy="78" r="3" fill="#8b5cf6"/> <!-- PRs -->
      <circle cx="16" cy="50" r="3.5" fill="#3b82f6"/> <!-- Commits -->

      <!-- Small Labels -->
      <text x="50" y="6" class="quadrant-label" fill="#f59e0b">Review</text>
      <text x="96" y="53" class="quadrant-label" fill="#10b981">Issues</text>
      <text x="50" y="103" class="quadrant-label" fill="#8b5cf6">PRs</text>
      <text x="4" y="53" class="quadrant-label" fill="#3b82f6">Commits</text>
    </g>

    <!-- Multi-Segment Distribution Bar -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="346" height="10" rx="5" fill="#1e293b"/>
      <!-- Commits: 69% = 239px -->
      <rect x="0" y="0" width="239" height="10" rx="5" fill="url(#shimmerCyan)"/>
      <!-- Issues: 11% = 38px -->
      <rect x="241" y="0" width="38" height="10" fill="url(#shimmerEmerald)"/>
      <!-- PRs: 11% = 38px -->
      <rect x="281" y="0" width="38" height="10" fill="url(#shimmerPurple)"/>
      <!-- Reviews: 9% = 25px -->
      <rect x="321" y="0" width="25" height="10" rx="5" fill="url(#shimmerAmber)"/>
    </g>

    <!-- Metrics Grid -->
    <g transform="translate(20, 188)">
      <!-- Row 1 -->
      <circle cx="6" cy="7" r="4" fill="#3b82f6"/>
      <text x="16" y="11" class="item-name">Commits</text>
      <text x="125" y="11" class="item-pct" fill="#38bdf8">69%</text>

      <circle cx="185" cy="7" r="4" fill="#10b981"/>
      <text x="195" y="11" class="item-name">Issues</text>
      <text x="315" y="11" class="item-pct" fill="#34d399">11%</text>

      <!-- Row 2 -->
      <circle cx="6" cy="33" r="4" fill="#8b5cf6"/>
      <text x="16" y="37" class="item-name">Pull Requests</text>
      <text x="125" y="37" class="item-pct" fill="#c084fc">11%</text>

      <circle cx="185" cy="33" r="4" fill="#f59e0b"/>
      <text x="195" y="37" class="item-name">Code Reviews</text>
      <text x="315" y="37" class="item-pct" fill="#fbbf24">9%</text>
    </g>

    <!-- Animated Footer Status Note -->
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="346" height="48" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="20" class="muted-text" font-size="11.5">✨ <tspan fill="#38bdf8" font-weight="600">Balanced Workflow:</tspan> Branching, PR Reviews &amp; Roadmap</text>
      <text x="29" y="36" class="muted-text" font-size="10.5">Continuous integration active across AIU departmental suites</text>
    </g>
  </g>

  <!-- Right Card: Languages & Core Stack -->
  <g transform="translate(438, 56)">
    <rect width="386" height="302" rx="12" fill="url(#cardGlass)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Header -->
    <text x="20" y="26" class="item-name" font-size="14">Most Used Languages &amp; Stack</text>
    <text x="20" y="42" class="header-sub">Calculated across verified codebase lines</text>

    <!-- Language 1: Python -->
    <g transform="translate(20, 58)">
      <circle cx="6" cy="7" r="4" fill="#38bdf8"/>
      <text x="16" y="11" class="item-name">Python</text>
      <text x="346" y="11" text-anchor="end" class="item-pct" fill="#38bdf8">52.1%</text>
      
      <!-- Progress Bar -->
      <rect x="0" y="18" width="346" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="18" width="180" height="7" rx="3.5" fill="url(#shimmerCyan)"/>

      <text x="0" y="37" class="muted-text" font-size="11">Bioinformatics &#8226; Microbiome Models &#8226; AI Logic</text>
    </g>

    <!-- Language 2: TypeScript -->
    <g transform="translate(20, 114)">
      <circle cx="6" cy="7" r="4" fill="#818cf8"/>
      <text x="16" y="11" class="item-name">TypeScript</text>
      <text x="346" y="11" text-anchor="end" class="item-pct" fill="#818cf8">47.9%</text>
      
      <!-- Progress Bar -->
      <rect x="0" y="18" width="346" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="18" width="166" height="7" rx="3.5" fill="url(#shimmerPurple)"/>

      <text x="0" y="37" class="muted-text" font-size="11">React Applications &#8226; Cloud Architecture &#8226; APIs</text>
    </g>

    <!-- Framework Highlights Box -->
    <g transform="translate(20, 172)">
      <rect x="0" y="0" width="346" height="116" rx="8" fill="#0f172a" stroke="#1e293b"/>
      
      <text x="14" y="20" class="stat-caption">Core Application Technologies</text>
      
      <!-- Badges Row 1 -->
      <g transform="translate(14, 28)">
        <!-- React 19 -->
        <rect x="0" y="0" width="72" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="36" y="16" class="pill-label" fill="#61dafb">React 19</text>

        <!-- Next / Vite -->
        <rect x="80" y="0" width="94" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="127" y="16" class="pill-label" fill="#ffffff">Next.js / Vite</text>

        <!-- Firebase -->
        <rect x="182" y="0" width="76" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="220" y="16" class="pill-label" fill="#f59e0b">Firebase</text>

        <!-- Capacitor -->
        <rect x="266" y="0" width="66" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="299" y="16" class="pill-label" fill="#38bdf8">Mobile</text>
      </g>

      <!-- Badges Row 2 (Scientific / AI Stack) -->
      <g transform="translate(14, 60)">
        <rect x="0" y="0" width="102" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="51" y="15" class="pill-label" font-size="10" fill="#a7f3d0">Biotechnology</text>

        <rect x="110" y="0" width="112" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="166" y="15" class="pill-label" font-size="10" fill="#bae6fd">AI Agent Coding</text>

        <rect x="230" y="0" width="102" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="281" y="15" class="pill-label" font-size="10" fill="#fbcfe8">Capacitor iOS</text>
      </g>

      <text x="14" y="102" class="muted-text" font-size="10.5">Automated schedules, lab inventory &amp; attendance systems</text>
    </g>
  </g>
</svg>