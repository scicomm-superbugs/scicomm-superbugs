<svg width="850" height="328" viewBox="0 0 850 328" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glass Panels -->
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1522" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Moving Shimmer Beam Gradient -->
    <linearGradient id="shimmerBeam" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="200%" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="300%" dur="2.8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.3px; }
    .header-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #64748b; font-weight: 500; }
    .stat-hero { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .stat-caption { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
    .item-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .item-pct { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .muted-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
    .pill-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .badge-live { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #10b981; letter-spacing: 0.6px; }
    .quadrant-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 600; }
  </style>

  <!-- Container Frame -->
  <rect x="0" y="0" width="850" height="328" rx="16" fill="url(#mainBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Bar -->
  <g transform="translate(26, 18)">
    <!-- Pulsing Cyan Dot -->
    <circle cx="6" cy="12" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="16" class="header-title">Engineering &amp; Activity Dashboard</text>
    <text x="295" y="16" class="header-sub">Realtime metrics synchronized across repositories</text>

    <!-- Animated Live Pill -->
    <rect x="674" y="2" width="124" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    
    <!-- SMIL Pulsing Beacon -->
    <circle cx="686" cy="13" r="3.5" fill="#10b981">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="686" cy="13" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="4;11;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="696" y="16.5" class="badge-live">LIVE METRICS</text>
  </g>

  <!-- Left Card: Contribution Radar & Metrics -->
  <g transform="translate(26, 54)">
    <rect width="386" height="254" rx="12" fill="url(#cardGlass)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Header -->
    <text x="20" y="26" class="item-name" font-size="14">Contribution Breakdown</text>
    <text x="20" y="42" class="header-sub">Distributed across 4 contribution quadrants</text>

    <!-- Top Left: Hero Stat (Clean Vertical Stack, Zero Overlap) -->
    <g transform="translate(20, 62)">
      <text x="0" y="28" class="stat-hero">772+</text>
      <text x="0" y="46" class="stat-caption">Total Contributions</text>
      <text x="0" y="63" class="header-sub">Active across 12 Repositories</text>
    </g>

    <!-- Top Right: Visual Interactive Radar Diamond Chart -->
    <g transform="translate(294, 94)">
      <!-- Radar Background Circles & Crosshair -->
      <circle cx="0" cy="0" r="36" fill="none" stroke="#1e293b" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#1e293b"/>
      
      <!-- Cross Axes -->
      <line x1="0" y1="-36" x2="0" y2="36" stroke="#1e293b" stroke-width="1"/>
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#1e293b" stroke-width="1"/>

      <!-- Diamond Polygon (Reviews 9%, Issues 11%, PRs 11%, Commits 69%) -->
      <polygon points="0,-18 22,0 0,22 -28,0" fill="#06b6d4" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1.8">
        <animate attributeName="fill-opacity" values="0.18;0.38;0.18" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1.6;2.4;1.6" dur="3s" repeatCount="indefinite"/>
      </polygon>
      
      <!-- SMIL Continuous Rotating Radar Sweep Line -->
      <line x1="0" y1="0" x2="0" y2="-36" stroke="url(#sweepGrad)" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </line>

      <!-- Center Pulsing Anchor & Sonar Wave Ring -->
      <circle cx="0" cy="0" r="3.5" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6">
        <animate attributeName="r" values="6;34;6" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.05;0.8" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Quadrant Colored Nodes -->
      <circle cx="0" cy="-18" r="3.5" fill="#f59e0b"/> <!-- Review -->
      <circle cx="22" cy="0" r="3.5" fill="#10b981"/> <!-- Issues -->
      <circle cx="0" cy="22" r="3.5" fill="#8b5cf6"/> <!-- PRs -->
      <circle cx="-28" cy="0" r="3.5" fill="#3b82f6"/> <!-- Commits -->

      <!-- Refined Non-Overlapping Labels with Generous Margins -->
      <text x="0" y="-24" class="quadrant-label" fill="#f59e0b" text-anchor="middle">Review</text>
      <text x="28" y="3.5" class="quadrant-label" fill="#10b981" text-anchor="start">Issues</text>
      <text x="0" y="32" class="quadrant-label" fill="#8b5cf6" text-anchor="middle">PRs</text>
      <text x="-34" y="3.5" class="quadrant-label" fill="#38bdf8" text-anchor="end">Commits</text>
    </g>

    <!-- Multi-Segment Distribution Bar -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="346" height="10" rx="5" fill="#1e293b"/>
      <!-- Commits: 69% = 239px -->
      <rect x="0" y="0" width="239" height="10" rx="5" fill="url(#barCyan)"/>
      <!-- Issues: 11% = 38px -->
      <rect x="241" y="0" width="38" height="10" fill="url(#barEmerald)"/>
      <!-- PRs: 11% = 38px -->
      <rect x="281" y="0" width="38" height="10" fill="url(#barPurple)"/>
      <!-- Reviews: 9% = 25px -->
      <rect x="321" y="0" width="25" height="10" rx="5" fill="url(#barAmber)"/>
      <!-- Moving Shimmer Beam Overlay -->
      <rect x="0" y="0" width="346" height="10" rx="5" fill="url(#shimmerBeam)"/>
    </g>

    <!-- Metrics Grid -->
    <g transform="translate(20, 188)">
      <!-- Row 1 -->
      <circle cx="6" cy="7" r="4" fill="#3b82f6"/>
      <text x="16" y="11" class="item-name">Commits</text>
      <text x="125" y="11" class="item-pct" fill="#38bdf8">69%</text>

      <circle cx="185" cy="7" r="4" fill="#10b981"/>
      <text x="195" y="11" class="item-name">Issues</text>
      <text x="315" y="11" class="item-pct" fill="#34d399">11%</text>

      <!-- Row 2 -->
      <circle cx="6" cy="33" r="4" fill="#8b5cf6"/>
      <text x="16" y="37" class="item-name">Pull Requests</text>
      <text x="125" y="37" class="item-pct" fill="#c084fc">11%</text>

      <circle cx="185" cy="33" r="4" fill="#f59e0b"/>
      <text x="195" y="37" class="item-name">Code Reviews</text>
      <text x="315" y="37" class="item-pct" fill="#fbbf24">9%</text>
    </g>
  </g>

  <!-- Right Card: Languages & Core Stack -->
  <g transform="translate(438, 54)">
    <rect width="386" height="254" rx="12" fill="url(#cardGlass)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Header -->
    <text x="20" y="26" class="item-name" font-size="14">Most Used Languages &amp; Stack</text>
    <text x="20" y="42" class="header-sub">Calculated across verified codebase lines</text>

    <!-- Language 1: Python -->
    <g transform="translate(20, 58)">
      <circle cx="6" cy="7" r="4" fill="#38bdf8"/>
      <text x="16" y="11" class="item-name">Python</text>
      <text x="346" y="11" text-anchor="end" class="item-pct" fill="#38bdf8">52.1%</text>
      
      <!-- Progress Bar + Shimmer -->
      <rect x="0" y="18" width="346" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="18" width="180" height="7" rx="3.5" fill="url(#barCyan)"/>
      <rect x="0" y="18" width="180" height="7" rx="3.5" fill="url(#shimmerBeam)"/>

      <text x="0" y="37" class="muted-text" font-size="11">Bioinformatics &#8226; Microbiome Models &#8226; AI Logic</text>
    </g>

    <!-- Language 2: TypeScript -->
    <g transform="translate(20, 114)">
      <circle cx="6" cy="7" r="4" fill="#818cf8"/>
      <text x="16" y="11" class="item-name">TypeScript</text>
      <text x="346" y="11" text-anchor="end" class="item-pct" fill="#818cf8">47.9%</text>
      
      <!-- Progress Bar + Shimmer -->
      <rect x="0" y="18" width="346" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="0" y="18" width="166" height="7" rx="3.5" fill="url(#barPurple)"/>
      <rect x="0" y="18" width="166" height="7" rx="3.5" fill="url(#shimmerBeam)"/>

      <text x="0" y="37" class="muted-text" font-size="11">React Applications &#8226; Cloud Architecture &#8226; APIs</text>
    </g>

    <!-- Framework Highlights Box -->
    <g transform="translate(20, 172)">
      <rect x="0" y="0" width="346" height="64" rx="8" fill="#0f172a" stroke="#1e293b"/>
      
      <text x="14" y="20" class="stat-caption">Core Application Technologies</text>
      
      <!-- Badges Row -->
      <g transform="translate(14, 28)">
        <!-- React 19 -->
        <rect x="0" y="0" width="72" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="36" y="16" class="pill-label" fill="#61dafb">React 19</text>

        <!-- Next / Vite -->
        <rect x="80" y="0" width="94" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="127" y="16" class="pill-label" fill="#ffffff">Next.js / Vite</text>

        <!-- Firebase -->
        <rect x="182" y="0" width="76" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="220" y="16" class="pill-label" fill="#f59e0b">Firebase</text>

        <!-- Mobile -->
        <rect x="266" y="0" width="66" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
        <text x="299" y="16" class="pill-label" fill="#38bdf8">Mobile</text>
      </g>
    </g>
  </g>
</svg>