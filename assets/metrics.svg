<svg width="850" height="360" viewBox="0 0 850 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f1724" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #f1f5f9; letter-spacing: 0.3px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; font-weight: 500; }
    .stat-number { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .item-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #e2e8f0; font-weight: 600; }
    .item-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #94a3b8; font-weight: 600; font-variant-numeric: tabular-nums; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #10b981; }
  </style>

  <!-- Main Container -->
  <rect x="0" y="0" width="850" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Navigation Header -->
  <g transform="translate(28, 20)">
    <circle cx="6" cy="14" r="4" fill="#10b981" filter="url(#glow)"/>
    <text x="18" y="18" class="title">Engineering &amp; Activity Dashboard</text>
    <text x="290" y="18" class="subtitle">Realtime metrics synchronized across repositories</text>
    
    <!-- Status Badge -->
    <rect x="670" y="4" width="124" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <circle cx="682" cy="15" r="3" fill="#10b981"/>
    <text x="692" y="18.5" class="badge-text">LIVE METRICS</text>
  </g>

  <!-- Left Panel: Activity & Contributions Overview -->
  <g transform="translate(28, 62)">
    <rect width="382" height="272" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Header -->
    <text x="20" y="28" class="item-label" font-size="14">Contribution Breakdown</text>
    <text x="20" y="44" class="subtitle">Distributed across 4 contribution quadrants</text>

    <!-- Big Stat Callout -->
    <g transform="translate(20, 60)">
      <text x="0" y="26" class="stat-number">746+</text>
      <text x="110" y="16" class="stat-label">Total Contributions</text>
      <text x="110" y="30" class="subtitle">Active across 12 Repositories</text>
    </g>

    <!-- Multi-Segment Distribution Bar -->
    <g transform="translate(20, 114)">
      <rect x="0" y="0" width="342" height="10" rx="5" fill="#1e293b"/>
      <!-- Commits: 69% = 236px -->
      <rect x="0" y="0" width="236" height="10" rx="5" fill="url(#cyanGrad)"/>
      <!-- Issues: 11% = 38px -->
      <rect x="238" y="0" width="38" height="10" fill="url(#emeraldGrad)"/>
      <!-- PRs: 11% = 38px -->
      <rect x="278" y="0" width="38" height="10" fill="url(#purpleGrad)"/>
      <!-- Reviews: 9% = 31px -->
      <rect x="318" y="0" width="24" height="10" rx="5" fill="url(#amberGrad)"/>
    </g>

    <!-- Stat Items Grid -->
    <g transform="translate(20, 146)">
      <!-- Row 1: Commits & Issues -->
      <circle cx="6" cy="6" r="4" fill="#3b82f6"/>
      <text x="16" y="10" class="item-label">Commits</text>
      <text x="135" y="10" class="item-value">69%</text>

      <circle cx="185" cy="6" r="4" fill="#10b981"/>
      <text x="195" y="10" class="item-label">Issues</text>
      <text x="315" y="10" class="item-value">11%</text>

      <!-- Row 2: Pull Requests & Code Reviews -->
      <circle cx="6" cy="38" r="4" fill="#8b5cf6"/>
      <text x="16" y="42" class="item-label">Pull Requests</text>
      <text x="135" y="42" class="item-value">11%</text>

      <circle cx="185" cy="38" r="4" fill="#f59e0b"/>
      <text x="195" y="42" class="item-label">Code Reviews</text>
      <text x="315" y="42" class="item-value">9%</text>

      <!-- Summary Note -->
      <rect x="0" y="66" width="342" height="42" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="84" class="subtitle" font-size="11">✨ <tspan fill="#38bdf8" font-weight="600">Balanced Workflow:</tspan> Branching, PR Reviews &amp; Roadmap</text>
      <text x="29" y="98" class="subtitle" font-size="10.5">Tickets active in daily AIU laboratory operations</text>
    </g>
  </g>

  <!-- Right Panel: Languages & Technology Stack -->
  <g transform="translate(440, 62)">
    <rect width="382" height="272" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Header -->
    <text x="20" y="28" class="item-label" font-size="14">Most Used Languages &amp; Core Tech</text>
    <text x="20" y="44" class="subtitle">Calculated across verified codebase lines</text>

    <!-- Language 1: Python -->
    <g transform="translate(20, 68)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="16" y="10" class="item-label">Python</text>
      <text x="220" y="10" class="subtitle">Bioinformatics / AI Modeling</text>
      <text x="342" y="10" text-anchor="end" class="item-value">52.1%</text>
      <rect x="0" y="18" width="342" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="18" width="178" height="8" rx="4" fill="url(#cyanGrad)"/>
    </g>

    <!-- Language 2: TypeScript -->
    <g transform="translate(20, 116)">
      <circle cx="6" cy="6" r="4" fill="#3178c6"/>
      <text x="16" y="10" class="item-label">TypeScript</text>
      <text x="220" y="10" class="subtitle">React / Cloud Architectures</text>
      <text x="342" y="10" text-anchor="end" class="item-value">47.9%</text>
      <rect x="0" y="18" width="342" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="18" width="164" height="8" rx="4" fill="url(#purpleGrad)"/>
    </g>

    <!-- Framework Highlights Box -->
    <g transform="translate(20, 172)">
      <rect x="0" y="0" width="342" height="82" rx="8" fill="#0f172a" stroke="#1e293b"/>
      
      <text x="14" y="22" class="item-label" font-size="12">Core Application Stack</text>
      
      <!-- Pill 1: React 19 -->
      <rect x="14" y="32" width="70" height="22" rx="6" fill="#1e293b"/>
      <text x="49" y="47" class="subtitle" font-size="11" font-weight="600" text-anchor="middle" fill="#61dafb">React 19</text>

      <!-- Pill 2: Next.js / Vite -->
      <rect x="90" y="32" width="86" height="22" rx="6" fill="#1e293b"/>
      <text x="133" y="47" class="subtitle" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">Next.js / Vite</text>

      <!-- Pill 3: Firebase -->
      <rect x="182" y="32" width="74" height="22" rx="6" fill="#1e293b"/>
      <text x="219" y="47" class="subtitle" font-size="11" font-weight="600" text-anchor="middle" fill="#f59e0b">Firebase</text>

      <!-- Pill 4: Capacitor -->
      <rect x="262" y="32" width="66" height="22" rx="6" fill="#1e293b"/>
      <text x="295" y="47" class="subtitle" font-size="11" font-weight="600" text-anchor="middle" fill="#38bdf8">Mobile</text>

      <!-- Subtext -->
      <text x="14" y="70" class="subtitle" font-size="10.5">Automated schedules, lab inventory &amp; attendance systems</text>
    </g>
  </g>
</svg>